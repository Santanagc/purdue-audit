services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: otshield-backend
    env_file:
      - ./backend/.env
    environment:
      - PORT=8000
    ports:
      - "8000:8000"
    tmpfs:
      - /tmp:size=128m,mode=1777
    read_only: true
    restart: unless-stopped

  frontend:
    image: node:22-alpine
    container_name: otshield-frontend
    working_dir: /app
    command: sh -c "npm install --silent --no-audit --no-fund && npm run dev -- -H 0.0.0.0"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
