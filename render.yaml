# Render Blueprint — backend FastAPI do OT-Shield AI (edição portfólio, plano gratuito).
services:
  - type: web
    name: ot-shield-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: ENV
        value: production
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: CORS_ORIGINS
        sync: false
      # mock = motor especialista local (sem custo de API). Para usar o Claude: anthropic + ANTHROPIC_API_KEY.
      - key: LLM_PROVIDER
        value: mock
      - key: MAX_UPLOAD_MB
        value: "10"
      - key: RATE_LIMIT_AUDIT_PER_MINUTE
        value: "10"
