name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -q -r requirements.txt
      - run: python -m pytest -q --tb=short

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/Dockerfile
      - run: docker build -t ot-shield-api ./backend
      - name: Smoke test do container
        run: |
          docker run -d --name api -p 8080:8080 ot-shield-api
          for i in $(seq 1 30); do curl -sf http://localhost:8080/api/v1/health && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/docs)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/v1/audit/demo)" = "200"
          test "$(docker inspect --format '{{.Config.User}}' ot-shield-api)" = "10001:10001"
          test "$(docker inspect --format '{{.State.Health.Status}}' api)" != "unhealthy"
